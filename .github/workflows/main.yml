name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: ant
      - uses: actions/upload-artifact@v4
        with:
          name: aladin
          path: '**/*.jar'
